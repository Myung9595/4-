<title>서울 끝</title>
<meta name="description" content="핵이 떨어진 지 100일. 불 꺼진 수도권을 가로질러 동생에게 가는 생존 어드벤처 — 1차 테스트 빌드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #0a0b0d;
  --panel: rgba(14, 15, 18, 0.94);
  --panel-2: rgba(28, 30, 35, 0.96);
  --line: rgba(255, 255, 255, 0.09);
  --text: #e9e6df;
  --muted: #9a978f;
  --dim: #6c6a65;
  --accent: #e3b341;      /* 민방위 노랑 */
  --warn: #e0742c;        /* 경고 주황 */
  --danger: #d64b3c;
  --cool: #8fb3cc;
  --ok: #7fb069;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --serif: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; }
[hidden] { display: none !important; }

#app { position: fixed; inset: 0; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); transition: opacity 1s; }
#vignette.heavy { background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.85) 100%); }

/* ── HUD ── */
#hud { position: absolute; left: 0; right: 0; top: 0; padding: max(10px, env(safe-area-inset-top)) 14px 0; display: flex; gap: 14px; align-items: flex-start; pointer-events: none; font-size: 13px; }
.hud-left { min-width: 0; flex: 1; }
#clock { font-weight: 700; letter-spacing: .04em; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; }
#objective { margin-top: 4px; color: var(--accent); font-size: 12.5px; text-shadow: 0 1px 2px #000; max-width: 46ch; }
#objective:not(:empty)::before { content: "▸ "; }
#stats { display: grid; grid-template-columns: auto 74px; gap: 3px 7px; align-items: center; font-size: 11px; color: var(--muted); background: rgba(0,0,0,.35); padding: 7px 9px; border-radius: 6px; }
.bar { height: 5px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--text); transition: width .4s; }
.bar.low > i { background: var(--danger); }
.bar.rad > i { background: var(--ok); }
.hud-right { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
#battery, #light-ind { font-size: 12px; font-variant-numeric: tabular-nums; background: rgba(0,0,0,.35); padding: 4px 8px; border-radius: 5px; }
#battery.low { color: var(--danger); }
.icon-btn { background: rgba(0,0,0,.35); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; font-size: 12px; padding: 4px 8px; cursor: pointer; }
.icon-btn.off { text-decoration: line-through; }

#timer { position: absolute; top: max(54px, calc(env(safe-area-inset-top) + 44px)); left: 50%; transform: translateX(-50%); font: 800 34px/1 var(--sans); color: var(--warn); letter-spacing: .06em; text-shadow: 0 0 18px rgba(224,116,44,.45); z-index: 55; pointer-events: none; font-variant-numeric: tabular-nums; }
#timer small { display: block; text-align: center; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .1em; margin-top: 4px; }
#timer.urgent { color: var(--danger); animation: pulse .5s infinite alternate; }
@keyframes pulse { to { opacity: .55; } }

#prompt { position: absolute; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); padding: 7px 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; pointer-events: none; }
#prompt kbd { display: inline-block; background: var(--accent); color: #111; font: 700 11px var(--sans); padding: 1px 6px; border-radius: 4px; margin-right: 7px; }

#toasts { position: absolute; left: 14px; bottom: calc(70px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 25; }
.toast { background: var(--panel); border-left: 3px solid var(--accent); padding: 7px 12px; font-size: 13px; border-radius: 4px; max-width: min(360px, 80vw); animation: tin .25s ease-out; }
.toast.out { opacity: 0; transition: opacity .6s; }
@keyframes tin { from { opacity: 0; transform: translateY(6px); } }

/* ── 대화 ── */
#dialog { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom)); width: min(760px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px 18px; z-index: 40; cursor: pointer; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.dlg-name { font-weight: 700; font-size: 13px; color: var(--accent); margin-bottom: 6px; letter-spacing: .02em; }
.dlg-name:empty { display: none; }
.dlg-text { font-size: 16px; line-height: 1.7; min-height: 1.7em; white-space: pre-wrap; word-break: keep-all; }
#dialog.narr .dlg-text { font-family: var(--serif); color: #d8d4ca; font-size: 16.5px; }
#dialog.radio .dlg-text { font-family: var(--sans); color: var(--cool); }
.dlg-more { position: absolute; right: 16px; bottom: 8px; font-size: 11px; color: var(--muted); animation: bob 1s infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }
.dlg-choices { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.dlg-choices:empty { display: none; }
.choice { text-align: left; background: rgba(255,255,255,.04); border: 1px solid var(--line); color: var(--text); padding: 10px 12px; border-radius: 6px; font-size: 15px; cursor: pointer; }
.choice .num { color: var(--muted); margin-right: 8px; font-size: 12px; }
.choice.sel, .choice:hover { border-color: var(--accent); background: rgba(227,179,65,.08); }
.choice .tag { color: var(--accent); font-size: 12px; margin-left: 4px; }

/* ── 모달 공통 (가방·선반·휴대폰) ── */
#modal { position: absolute; inset: 0; background: rgba(0,0,0,.55); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
.panel { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; width: min(720px, 100%); max-height: min(560px, calc(100vh - 32px)); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.panel-head h2 { margin: 0; font-size: 16px; flex: 1; }
.panel-close { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
.cap { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cap b { color: var(--text); }
.cap.full b { color: var(--danger); }
.panel-body { overflow: auto; padding: 12px 16px 16px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.col-title { font-size: 12px; color: var(--muted); margin: 2px 0 8px; letter-spacing: .05em; }
.row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; margin-bottom: 6px; background: rgba(255,255,255,.02); }
.row .nm { flex: 1; font-size: 14px; min-width: 0; }
.row .nm small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; line-height: 1.45; }
.row .sz { font-size: 11px; color: var(--dim); white-space: nowrap; }
.btn { background: rgba(255,255,255,.06); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #141414; border-color: var(--accent); font-weight: 700; }
.btn:disabled { opacity: .35; cursor: default; }
.empty { color: var(--dim); font-size: 13px; padding: 10px 2px; }
.row.sel { border-color: var(--accent); }

/* ── 휴대폰 ── */
.phone { width: min(360px, 100%); height: min(620px, calc(100vh - 32px)); background: #111316; border-radius: 30px; border: 1px solid #2a2d33; box-shadow: 0 0 0 6px #1a1c20, 0 30px 80px rgba(0,0,0,.7); display: flex; flex-direction: column; overflow: hidden; }
.ph-status { display: flex; justify-content: space-between; padding: 12px 22px 6px; font-size: 12px; color: #cfcfcf; font-variant-numeric: tabular-nums; }
.ph-status .nosig { color: var(--danger); }
.ph-tabs { display: flex; gap: 4px; padding: 6px 12px; }
.ph-tabs button { flex: 1; background: none; border: none; color: var(--muted); padding: 8px 4px; border-bottom: 2px solid transparent; cursor: pointer; font-size: 13px; }
.ph-tabs button.on { color: var(--text); border-color: var(--accent); }
.ph-body { flex: 1; overflow: auto; padding: 10px 14px; }
.ph-foot { padding: 10px 14px 16px; border-top: 1px solid #23262b; display: flex; gap: 8px; }
.ph-foot .btn { flex: 1; }
.thread-h { text-align: center; font-size: 13px; font-weight: 700; padding: 4px 0 10px; }
.thread-h small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
.msg { max-width: 80%; padding: 8px 11px; border-radius: 14px; margin: 4px 0; font-size: 14px; line-height: 1.5; word-break: keep-all; }
.msg.them { background: #262a30; border-bottom-left-radius: 4px; }
.msg.me { background: #3b4a2f; margin-left: auto; border-bottom-right-radius: 4px; }
.msg.fail { background: #3a2a28; }
.msg-meta { font-size: 10.5px; color: var(--dim); margin: 0 4px 6px; }
.msg-meta.right { text-align: right; }
.msg-meta .err { color: var(--danger); }
.day-sep { text-align: center; color: var(--dim); font-size: 11px; margin: 12px 0 6px; }
.alert-card { border: 1px solid #4a3a2a; background: #1e1814; border-radius: 10px; padding: 11px 12px; margin-bottom: 8px; }
.alert-card h4 { margin: 0 0 4px; font-size: 13px; color: var(--warn); display: flex; justify-content: space-between; }
.alert-card p { margin: 0; font-size: 13.5px; line-height: 1.55; }
.game-mark { font-size: 10px; color: var(--dim); margin-top: 6px; letter-spacing: .05em; }
.memo { font-size: 14px; line-height: 1.6; padding: 8px 2px; border-bottom: 1px dashed #2a2d33; }
.memo.done { color: var(--dim); text-decoration: line-through; }

/* 재난문자 팝업 (게임 고유 디자인 — 실제 문자와 구분되도록 표식 포함) */
#popup { position: absolute; inset: 0; z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding-top: max(40px, 8vh); background: rgba(0,0,0,.35); }
.alert-pop { width: min(420px, calc(100vw - 24px)); background: #1b1512; border: 1px solid #6b4a2a; border-radius: 14px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.6); animation: drop .3s ease-out; cursor: pointer; }
@keyframes drop { from { transform: translateY(-20px); opacity: 0; } }
.alert-pop .ap-head { background: linear-gradient(90deg, #8a3a1c, #b5521f); color: #fff; padding: 9px 14px; font-weight: 700; font-size: 13px; display: flex; justify-content: space-between; }
.alert-pop .ap-body { padding: 14px 16px 6px; font-size: 15px; line-height: 1.65; }
.alert-pop .ap-mark { padding: 4px 16px 12px; font-size: 10.5px; color: #8d7a68; letter-spacing: .04em; }
.call-pop { width: min(300px, calc(100vw - 24px)); background: #15181c; border-radius: 22px; padding: 26px 20px 22px; text-align: center; border: 1px solid #2a2d33; animation: drop .3s ease-out; }
.call-pop .who { font-size: 20px; font-weight: 700; }
.call-pop .st { color: var(--muted); font-size: 13px; margin-top: 6px; }
.call-pop .ring { width: 54px; height: 54px; border-radius: 50%; background: var(--ok); margin: 18px auto 0; animation: pulse .6s infinite alternate; }

/* ── 연출 레이어 ── */
#center-text { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font-family: var(--serif); font-size: clamp(18px, 3vw, 26px); text-align: center; color: #eee9dd; text-shadow: 0 2px 12px #000; z-index: 35; pointer-events: none; width: min(90vw, 760px); line-height: 1.7; transition: opacity .8s; word-break: keep-all; }
#center-text.big { font-family: var(--sans); font-weight: 800; color: var(--warn); font-size: clamp(26px, 5vw, 46px); letter-spacing: .04em; }
#center-text small { display: block; font-family: var(--sans); font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: .02em; margin-top: 8px; }
#flash { position: absolute; inset: 0; background: #fffef6; opacity: 0; pointer-events: none; z-index: 70; }
#fade { position: absolute; inset: 0; background: #000; opacity: 1; pointer-events: none; z-index: 65; transition: opacity 1s; }
#card { position: absolute; inset: 0; z-index: 80; background: #060607; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 24px; text-align: center; cursor: pointer; }
#card .line { font-family: var(--serif); font-size: clamp(17px, 2.6vw, 23px); line-height: 1.9; color: #e6e1d5; opacity: 0; transition: opacity 1.2s; word-break: keep-all; max-width: 760px; }
#card .line.on { opacity: 1; }
#card .line.kicker { font-family: var(--sans); font-size: 12px; letter-spacing: .25em; color: var(--muted); margin-bottom: 10px; }
#card .line.title { font-size: clamp(30px, 6vw, 54px); font-weight: 800; margin: 6px 0; }
#card .hint { position: absolute; bottom: 24px; font-size: 12px; color: var(--dim); opacity: 0; transition: opacity 1s; }
#card .hint.on { opacity: 1; }

/* 결산 */
.summary { width: min(640px, 100%); text-align: left; max-height: calc(100vh - 48px); overflow: auto; }
.summary h2 { font-family: var(--serif); font-size: clamp(26px, 5vw, 40px); margin: 6px 0 4px; text-align: center; }
.summary .k { text-align: center; font-size: 12px; letter-spacing: .25em; color: var(--muted); }
.summary .sec { margin-top: 22px; }
.summary .sec h3 { font-size: 13px; color: var(--accent); margin: 0 0 8px; font-weight: 700; }
.summary .sec p, .summary li { font-size: 14.5px; line-height: 1.7; color: #d9d5cb; margin: 0; }
.summary ul { margin: 0; padding-left: 18px; }
.summary .next { margin-top: 26px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; font-family: var(--serif); font-size: 15px; line-height: 1.7; }
.summary .btns { display: flex; gap: 10px; justify-content: center; margin-top: 22px; }

/* ── 타이틀 ── */
#title { position: absolute; inset: 0; z-index: 90; background: radial-gradient(ellipse at 70% 10%, rgba(224,116,44,.16), transparent 55%), #070708; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: auto; }
.title-inner { max-width: 560px; width: 100%; }
.title-kicker { font-size: 12px; letter-spacing: .22em; color: var(--muted); }
#title h1 { font-family: var(--serif); font-weight: 800; font-size: clamp(56px, 13vw, 104px); margin: 8px 0 6px; letter-spacing: -.02em; line-height: 1; }
.title-sub { font-family: var(--serif); font-size: 17px; line-height: 1.8; color: #cfcabe; margin: 0 0 26px; }
.title-btns { display: flex; flex-wrap: wrap; gap: 10px; }
.title-btns button { padding: 13px 22px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--text); font-size: 15px; cursor: pointer; }
.title-btns button.primary { background: var(--accent); color: #141414; border-color: var(--accent); font-weight: 700; }
.title-help { margin-top: 26px; font-size: 12.5px; color: var(--muted); line-height: 1.9; }
.title-help b { color: var(--text); font-weight: 500; }
.title-note { margin-top: 18px; font-size: 11.5px; color: var(--dim); line-height: 1.7; }
.touch-only { display: none; }
body.touch .touch-only { display: block; }

/* ── 터치 조작 ── */
#touch { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
#stick-zone { position: absolute; left: 0; bottom: 0; width: 50%; height: 70%; pointer-events: auto; }
#stick-base { position: absolute; width: 110px; height: 110px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.04); display: none; }
#stick-knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255,255,255,.25); }
#touch-btns { position: absolute; right: calc(14px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: auto auto; gap: 10px; align-items: end; pointer-events: auto; }
.tbtn { border: 1px solid rgba(255,255,255,.2); background: rgba(20,22,26,.7); color: var(--text); border-radius: 999px; font-size: 13px; }
.tbtn.small { padding: 9px 12px; }
.tbtn.big { width: 76px; height: 76px; font-size: 15px; font-weight: 700; background: rgba(227,179,65,.25); border-color: rgba(227,179,65,.6); grid-column: 2; grid-row: 1 / span 3; }
body.in-ui #touch-btns, body.in-ui #stick-zone { display: none; }
body.touch #prompt { bottom: calc(110px + env(safe-area-inset-bottom)); }
body.touch #toasts { bottom: calc(140px + env(safe-area-inset-bottom)); }

@media (max-width: 640px) {
  #stats { grid-template-columns: auto 52px; font-size: 10px; padding: 5px 7px; }
  #objective { font-size: 11.5px; }
  .cols { grid-template-columns: 1fr; }
  .dlg-text { font-size: 15px; }
}
@media (max-height: 460px) {
  #dialog { padding: 10px 14px 12px; }
  .dlg-text { font-size: 14.5px; line-height: 1.55; }
  .choice { padding: 7px 10px; font-size: 14px; }
}

</style>
<div id="app">
  <canvas id="view" aria-label="게임 화면"></canvas>
  <div id="vignette"></div>

  <div id="hud" hidden>
    <div class="hud-left">
      <div id="clock">D+0 03:50</div>
      <div id="objective"></div>
    </div>
    <div id="stats"></div>
    <div class="hud-right">
      <span id="light-ind" hidden></span>
      <span id="battery">64%</span>
      <button id="btn-mute" class="icon-btn" aria-label="소리 끄기/켜기">소리</button>
    </div>
  </div>

  <div id="timer" hidden></div>
  <div id="prompt" hidden></div>
  <div id="toasts" aria-live="polite"></div>

  <div id="dialog" hidden>
    <div class="dlg-name"></div>
    <div class="dlg-text"></div>
    <div class="dlg-choices"></div>
    <div class="dlg-more">▼</div>
  </div>

  <div id="modal" hidden></div>
  <div id="popup" hidden></div>
  <div id="center-text" hidden></div>
  <div id="flash"></div>
  <div id="fade"></div>
  <div id="card" hidden></div>

  <div id="touch" hidden>
    <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
    <div id="touch-btns">
      <button data-act="light" class="tbtn small">손전등</button>
      <button data-act="phone" class="tbtn small">휴대폰</button>
      <button data-act="bag" class="tbtn small">가방</button>
      <button data-act="use" class="tbtn big">행동</button>
    </div>
  </div>

  <div id="title">
    <div class="title-inner">
      <div class="title-kicker">1차 테스트 빌드 · 1장 「배곧」 프롤로그</div>
      <h1>서울 끝</h1>
      <p class="title-sub">핵이 떨어진 지 100일.<br>불 꺼진 수도권을 가로질러, 동생에게 간다.</p>
      <div class="title-btns">
        <button id="btn-new" class="primary">새로 시작</button>
        <button id="btn-continue" hidden>이어하기 · 마지막으로 잠든 날</button>
      </div>
      <div class="title-help">
        <div><b>이동</b> WASD / 방향키 · <b>달리기</b> Shift</div>
        <div><b>살펴보기·대화</b> E / Space · <b>손전등</b> F · <b>휴대폰</b> P · <b>가방</b> I</div>
        <div class="touch-only">휴대폰에서는 화면 왼쪽을 끌어 이동하세요. 가로 화면을 권장합니다.</div>
      </div>
      <p class="title-note">이 게임은 전쟁과 핵 재난을 다루는 픽션입니다. 등장하는 재난문자, 단체, 인물, 상호는 모두 가상이며 실제와 관련이 없습니다. 소리를 켜고 플레이하길 권합니다.</p>
    </div>
  </div>
